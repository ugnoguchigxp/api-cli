[package]
name = "api-cli"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
description = "Local-first capability broker that exposes allowlisted REST API actions over CLI and MCP"
license = "MIT"
repository = "https://github.com/ugnoguchigxp/api-cli"
homepage = "https://github.com/ugnoguchigxp/api-cli"
readme = "README.md"
keywords = ["mcp", "api", "cli", "oauth", "security"]
categories = ["command-line-utilities", "authentication"]
include = [
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/docs/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[dependencies]
# CLI / async
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.37", features = ["full"] }

# Serialize / HTTP
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde_jcs = "0.2"
jsonschema = { version = "0.33", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.0.0", default-features = false, features = ["client", "server", "transport-io", "transport-streamable-http-server", "request-state", "elicitation"] }

# DB / Crypto
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
aes-gcm = "0.10"
rand = "0.8"
keyring = "4.1.5"
redis = { version = "0.32.7", features = ["tokio-rustls-comp", "connection-manager"] }
async-trait = "0.1"
fs2 = "0.4"

# Err / Logging
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Utility
directories = "5.0"
url = "2.5"
sha2 = "0.10"
base64 = "0.22"
axum = "0.7"
tower-http = { version = "0.6", features = ["cors", "limit"] }
rpassword = "7.3"
uuid = { version = "1.8", features = ["v4"] }
hex = "0.4"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
